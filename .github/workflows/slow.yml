name: slow

# The long culvert gates marked `slow` (TASK-3674): the 42 unsteady SWMM series and
# three 2D flume runs of tests/test_inlet_control_unsteady.py (~10 min on 16 cores)
# and the 2D bridge_hecras run (~3 min). The push/PR lanes (tests, pip, conda-env)
# run `-m "not slow"`; this lane runs only the slow ones, on a schedule and on demand.
# Scheduled-only, so it is not a ruleset required check (TASK-3668); parked D26 reds are xfail(strict).

on:
  schedule:
    - cron: "0 17 * * *"   # daily, 17:00 UTC
  workflow_dispatch:

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Hydrata anuga_core fork at the pinned SHA (TASK-3668). The action also exports
      # ANUGA_CORE_DIR = that checkout, where test_bridge_hecras_swmm reads the HEC-RAS gauges.
      - name: Install the anuga_core fork (pinned)
        uses: ./.github/actions/install-anuga-core

      - name: Install package + backends
        run: pip install -e .[swmm,pipedream,test]

      - name: Run the slow lane
        run: pytest -v -m slow -rs
