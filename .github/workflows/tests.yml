name: tests

# The push/PR gate (the fleet ruleset's required checks, TASK-3668): installs the Hydrata
# anuga_core fork at the pinned SHA (.github/actions/install-anuga-core; the same engine pin as
# run_anuga's batch/Dockerfile) plus both 1D backends, so the calculate_Q, headwall-coupler and
# factory tests RUN against the engine hydrata.com uses instead of skipping. pip.yml and
# conda-env.yml stay upstream's published-ANUGA (3.3.x) compatibility lanes.
#
# Parked D26 reds (epic 3585 D26/D27, watch-list TASK-3683) are xfail(strict) in the tests, not
# deselected here, so a fix flips them to XPASS and fails the job until the marker is removed:
#   tests/test_coupler.py::test_c2_vs_libswmm_gated_points_within_half_percent  (non-slow: runs here)
#   tests/test_inlet_control_unsteady.py::test_unsteady_forward_segment_inside_band[A|B|C|D]  (slow.yml)
#   tests/test_inlet_control_unsteady.py::test_unsteady_reverse_segment_inside_band  (slow.yml)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the anuga_core fork (pinned)
        uses: ./.github/actions/install-anuga-core

      - name: Install package + backends
        run: pip install -e .[swmm,pipedream,test]

      - name: Run tests
        run: pytest -v -m "not slow" -rs   # the slow gates run in slow.yml (TASK-3674); -rs lists any skip
